<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <div class ="form-container">
        <h1>Formulários</h1>

        <form method="POST" action="http://localhost:3003/usuarios">
            <input type="hidden" name="id" value="3">

            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for ="senha">Senha</label>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
            </div>

            <div class="form-group">
              <label for="bio">BIo</label>
              <textarrea name="bio" id="bio" cols="30" rows="10" placeholder="Conte um pouco sobre você"></textarrea>
            </div>
            <fieldset class="form-group">
                <legend>Tipo de usuarío</legend>
                <label for="admin">
                    <input type="radio" name="tipo" id="admin" value="admin">admin
                </label>
                <input type="radio" name="regular"
            </fieldset>
            
        </form>
    </div>
</body>
</html>
