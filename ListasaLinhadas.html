<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Alinhadas</title>
    <style>

        body{
            font-family: Arial, Helvetica, Sans-serif;
            background-color: aliceblue;
            color:black;
            margin: 0;
            padding: 0;
            text-align: center

        }

        header{
            
            color: rgb(0, 0, 241);
            padding: 20px;
            font-size: 1.5rem
        }

        .tree{
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: left
        }

        .tree li{
            padding-left: 20px;
            margin: 5px 0
        }

        .tree span[wm-folder]{
            cursor: pointer;
            font-weight: bold;
            color: cadetblue
        }

        .tree li > ul{
            display: none;
            margin-left: 20px
        }

        .tree li> ul li{
            padding-left:20px
        }

        .tree li> span[wm-folder]:hover{
            color: black
        }

    </style>
</head>
<body>
    <h1></h1>Projetos</h1>
    <ul class="tree">
         <li> 
            <span wm-folder>Backend</span>
         <ul>
             <li>
            <span wm-folder>app</span>
             <ul>
                    <li>produtos.js</li>
                    <li>usuarios.js</li>
                    <li>venda.js</li>
                 </ul>
             </li>
          <li>
              <span wm-folder>config</span>
            <ul>
               <li>banco.js</li>
               <li>rotas.js</li>
               <li>servidor.js</li>
               </ul>
            </li>
         </ul>
        </li>
        <li>
      <span wm-folder>frontend</span>
      <ul>
            </li>
                 <span wm-folder>public</span>
                 <ul>
                    <li>app.css</li>
                    <li>app.js</li>
                    <li>index.html</li>
                </ul>
            </li>
        </ul>
      </li>
   </ul>
   <link rel="stlysheet" href="http://files.cod3r.com.br/curso-web/tree.css">
   <script>
     document.querySelectorAll('[wm-folder]').forEach(folder =>{folder.onclick = function(e){ 
        const ul = folder.nextElementSibling
        const d = ul.style.display
        ul.style.display = d === 'none' ? 'block' : 'none'
        
      }
  } )
   

   </script>
</body>
</html>
