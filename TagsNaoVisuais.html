<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags Não Visuais</title>
    <style>
        div{
            display: flex;
            border: 3px solid #333;
            border-radius: 12px;
            margin: 10px;
            align-items: center;
            justify-content:center;
            text-align: center;

        }

        span{
            display:block;
        }

        .diferente{
            font-weight: bold;
            font-size: 30px;
            color: rgb(50, 8, 236);
        }
    </style>
</head>
<body>
    <h1>Tags Não Visuais</h1>


    <!-- tags semãnticas:
     
    section - agrupamento temático de contéudo
    article - contéudo auto-contido
    header - cabeçalho do documento
    footer - rodapé do documento
    nav - agrupa od links de navegações
    aside - de lado (ex. sidebar).relacionado com o cpnteúdo em volta (adendo).
    details - exibe detalhes que pode ser exibidos ou escondidos
    
    as famosas...
    div - divisão do conteúdo
    span - usado para agrupa elementos inline-->

    <div>
        <p> Área 1</p>
    </div>
    <div>
        <p> Área 2</p>
    </div>

    <p>
        Esse é um texto com <span class="diferente">muitas palavras</span> e ponto.
    </p>
</body>
</html>
